services:
  # --------------------------------------------------------------------------
  # Frontend — React + Vite dev server
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8000}
    depends_on:
      - api

  # --------------------------------------------------------------------------
  # Backend API — Laravel (PHP-FPM + built-in server for dev)
  # --------------------------------------------------------------------------
  api:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lodgeflow}
      DB_USERNAME: ${DB_USERNAME:-lodgeflow}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@lodgeflow.local
      MAIL_FROM_NAME: LodgeFlow
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # --------------------------------------------------------------------------
  # Queue Worker — processes background jobs (cleaning task creation, etc.)
  # --------------------------------------------------------------------------
  queue-worker:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    command: php artisan queue:work redis --tries=3 --backoff=60 --sleep=3 --queue=cleaning-tasks,default
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lodgeflow}
      DB_USERNAME: ${DB_USERNAME:-lodgeflow}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - api

  # --------------------------------------------------------------------------
  # PostgreSQL 16 — primary database
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lodgeflow}
      POSTGRES_USER: ${DB_USERNAME:-lodgeflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lodgeflow}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis 7 — queue broker and cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Mailpit — local email testing (SMTP + web UI)
  # --------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  pgdata:
  frontend_node_modules:
  backend_vendor:
